name: reus_tarragona_bus
description: Pianificatore di viaggio per la linea di autobus Reus - Tarragona (Monbus / e4).
publish_to: 'none'
version: 1.0.0+65

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  http: ^1.2.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.0
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.0
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  in_app_review: ^2.0.9
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/stops.json
    - assets/data/timetable_weekday.json
    - assets/data/timetable_weekday_august.json
    - assets/data/timetable_saturday.json
    - assets/data/timetable_sunday.json
    - assets/data/timetable_night.json
    - assets/data/timetable_night_salou.json
    - assets/data/timetable_night_nt3.json
    - assets/data/poi.json
    - assets/images/logo_bus.png
    - assets/sounds/
