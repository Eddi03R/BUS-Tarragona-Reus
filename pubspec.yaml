name: reus_tarragona_bus
description: Pianificatore di viaggio per la linea di autobus Reus - Tarragona (Monbus / e4).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.20.3
  http: ^1.2.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/stops.json
    - assets/data/timetable_weekday.json
    - assets/data/timetable_saturday.json
    - assets/data/timetable_sunday.json
